syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.measure";
option java_outer_classname = "MeasureProto";
option objc_class_prefix = "M";

package measure;

// Operating mode for the measurement threshold.
enum Mode {
  NORMAL = 0;
  CALIBRATION = 1;
}

// The service definition.
service Measure {
  // Sends a measurement
  rpc RecordMeasurement (Measurement) returns (MeasurementReceipt) {}
  // Subscribes a client to server-pushed threshold commands.
  rpc Subscribe (ClientInfo) returns (stream Command) {}
  // Operator command: put named client (or all clients) into calibration mode.
  rpc SetCalibrationMode (CalibrationRequest) returns (CalibrationResponse) {}
  // Acknowledge applying the latest desired state, not merely receiving bytes.
  rpc AcknowledgeCommand (CommandAcknowledgment) returns (CommandReceipt) {}
  // Reports the device's actual position; supported by movement protocol v2.
  rpc ReportPosition (PositionReport) returns (PositionReceipt) {}
}

// The request containing the measurement
message Measurement {
  int32 point = 1;
  string client_id = 2;
  int64 timestamp_unix_ms = 3;
  // Stable across retries; omitted only by legacy clients.
  string measurement_id = 4;
}

// OK means the measurement is durably stored (including duplicate retries).
message MeasurementReceipt {
  reserved 1;
  reserved "response";
  bool duplicate = 2;
  string measurement_id = 3;
}

// Identifies a subscribing client.
message ClientInfo {
  string client_id = 1;
  // 0 is the legacy, unacknowledged stream; 1 supports acknowledged threshold
  // state; 2 additionally supports movement state and position reports.
  uint32 protocol_version = 2;
}

// Server-pushed latest desired state for the client.
message Command {
  int32 threshold = 1;
  Mode mode = 2;
  int64 revision = 3;
  int64 expires_unix_ms = 4;
  uint32 protocol_version = 5;
  // Local fallback if calibration expires while disconnected.
  int32 normal_threshold = 6;
  // Movement fields are defined for protocol version 2. A false value means
  // the device should stop and retain its current position.
  bool has_destination = 7;
  double destination_x = 8;
  double destination_y = 9;
  // Coordinate units per second; must be finite and greater than zero when
  // has_destination is true.
  double movement_speed = 10;
}

// A device's actual coordinate in the bounded 0..100 world plane.
message PositionReport {
  string client_id = 1;
  double x = 2;
  double y = 3;
  // Device report time in Unix milliseconds.
  int64 timestamp_unix_ms = 4;
}

message PositionReceipt {}

message CommandAcknowledgment {
  string client_id = 1;
  int64 revision = 2;
}

message CommandReceipt {}

// Request to enter calibration mode.
message CalibrationRequest {
  // Client to target; empty string means broadcast to all connected clients.
  string client_id = 1;
  // How long to stay in calibration mode before reverting (seconds).
  int32 duration_seconds = 2;
}

// Acknowledgement of a calibration request.
message CalibrationResponse {
  bool accepted = 1;
}
